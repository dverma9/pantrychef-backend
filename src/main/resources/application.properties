# Application
spring.application.name=pantrychef-backend
spring.config.import=optional:file:./application-local.properties
server.port=8080

# Database
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/pantrychef}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:your_local_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Gemini API (Free tier)
gemini.api.key=${gemini.api.key:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent

# CORS
allowed.origins=${allowed.origins:}